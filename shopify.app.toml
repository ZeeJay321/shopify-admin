# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c49166f04f4081b4e2394151eb8b1c8a"
name = "ZJ Commerce Operations"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: catalog, collections + scoring; read_inventory:
# inventory levels and inventory_levels/update; read_locations: location names;
# read_orders: recent orders (last 60 days) and orders/* webhooks. Orders are
# protected customer data (level 1): configure access in the Partner Dashboard.
# write_products: confirmed SEO and status changes (productUpdate).
# write_inventory: confirmed stock adjustments (inventoryAdjustQuantities).
# read_publications: list sales channels, check what's published to them and
# receive product_publications/* webhooks (phase 6 Publishing check).
# write_publications: confirmed "Publish to <channel>" fixes
# (publishablePublish). Existing installs must re-approve.
# Never add read_all_orders, customer scopes or other write scopes without a
# reviewed need.
# See README "Scopes" before adding anything here.
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_orders,read_publications,write_publications"

[webhooks]
api_version = "2026-07"

  # Session housekeeping from the app template (not feature webhooks).
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Catalog + inventory changes: idempotent cache invalidation (phase 3).
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/catalog"
  topics = [ "products/create", "products/update", "products/delete", "inventory_levels/update" ]

  # Order changes: invalidate the Order Operations summary (phase 4).
  # Requires protected customer data access (level 1) for the app.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/catalog"
  topics = [ "orders/create", "orders/updated" ]

  # Sales channel publishing changes: invalidate readiness (phase 6).
  # Requires read_publications.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/catalog"
  topics = [ "product_publications/create", "product_publications/update", "product_publications/delete" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
